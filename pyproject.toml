[project]
name = "kgdc"
version = "0.1.0"
description = "Divide-and-conquer knowledge-graph extraction: ontology segments, SHACL fills, agents never fabricate"
requires-python = ">=3.11"
dependencies = ["rdflib>=7", "pyshacl>=0.30", "openai>=1", "python-dotenv>=1"]
[project.optional-dependencies]
dev = ["pytest"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["kgdc"]
